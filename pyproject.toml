[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atelier-photo-local"
version = "0.4.0"
description = "Tri et première retouche photo, entièrement sur votre ordinateur"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2,<3", "Pillow>=11,<13", "PySide6>=6.8,<7",
  "rawpy>=0.24,<0.28", "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.gui-scripts]
atelier-photo = "atelier.app:main"

[tool.setuptools.packages.find]
include = ["atelier*"]

[tool.setuptools.package-data]
atelier = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE001"]

