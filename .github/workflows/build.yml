name: Build desktop bundles
on: workflow_dispatch
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Version
        shell: bash
        run: echo "ATELIER_VERSION=$(python -c 'import atelier; print(atelier.__version__)')" >> "$GITHUB_ENV"
      - run: python -m pip install -e ".[dev]" Nuitka==4.1.1
      - run: python -m pip install -r requirements-tested.txt
      - run: python scripts/download_model.py
      - run: python scripts/download_licenses.py
      - run: python -m pytest -q
      - name: Check native Mac architecture
        if: runner.os == 'macOS'
        run: python -c "import platform; assert platform.machine() == 'arm64', 'Native Apple Silicon Python required'"
      - run: python scripts/build_release.py
      - name: Verify packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'test-output/packaged.json'
          $process = Start-Process -FilePath 'dist/${{ env.ATELIER_VERSION }}/AtelierPhoto.dist/AtelierPhoto.exe' -ArgumentList @('--self-test', $report) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Packaged test failed' }
          if (-not (Get-Content $report | ConvertFrom-Json).ok) { throw 'Packaged test failed' }
      - name: Verify packaged Mac app
        if: runner.os == 'macOS'
        run: |
          python scripts/macos_bundle.py dist/${{ env.ATELIER_VERSION }}/AtelierPhoto.app --self-test test-output/packaged.json --report test-output/macos-bundle.json
          python scripts/create_macos_dmg.py dist/${{ env.ATELIER_VERSION }}/AtelierPhoto.app
          ditto -c -k --keepParent dist/${{ env.ATELIER_VERSION }}/AtelierPhoto.app dist/AtelierPhoto-${{ env.ATELIER_VERSION }}-macOS-arm64-unsigned.zip
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/prepare_inno.ps1
          & ./.build-tools/inno/ISCC.exe "/DBundleDir=$PWD/dist/${{ env.ATELIER_VERSION }}/AtelierPhoto.dist" "/DAppVersion=${{ env.ATELIER_VERSION }}" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: AtelierPhoto-${{ matrix.os }}-unsigned
          path: |
            dist/*Setup.exe
            dist/*macOS-arm64-unsigned.zip
            dist/*macOS-arm64-test.dmg
            test-output/packaged.json
            test-output/macos-bundle.json
