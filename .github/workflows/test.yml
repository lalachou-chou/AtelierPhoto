name: Test desktop platforms
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-tested.txt
            pyproject.toml
            .github/workflows/test.yml
      - run: python -m pip install -r requirements-tested.txt -e ".[dev]"
      - run: python -m ruff check atelier scripts tests
      - run: python scripts/download_model.py
      - run: python -m pytest -q
